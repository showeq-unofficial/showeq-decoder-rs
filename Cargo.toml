[workspace]
resolver = "2"
# Backend-keyed layout. live+test each have a struct-mirror crate
# (`seq-structs-<t>`, a Rust mirror of backend/<t>/everquest.h) feeding the
# shared `seq-decode` parsers. eql owns no C wire structs: `seq-backend-eql` is
# a self-contained backend crate holding the offset+scale Legends parsers for
# the 5 diverged opcodes. The active backend is selected via the
# `backend-live` / `backend-test` / `backend-eql` Cargo features on `seq-decode`
# (forwarded from `seq-bridge`); live+eql share the Live struct set + decoders.
members = ["seq-decode", "seq-bridge", "seq-structs-live", "seq-structs-test", "seq-backend-eql", "seq-events", "seq-backend-live", "seq-protocol-data", "seq-session"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
authors = ["ShowEQ Developers"]
rust-version = "1.75"

[workspace.dependencies]
cxx = "1"
cxx-build = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
seq-decode = { path = "seq-decode", default-features = false }
seq-structs-live = { path = "seq-structs-live" }
seq-structs-test = { path = "seq-structs-test" }
seq-backend-eql = { path = "seq-backend-eql" }
seq-events = { path = "seq-events" }
seq-backend-live = { path = "seq-backend-live" }
seq-protocol-data = { path = "seq-protocol-data" }
seq-session = { path = "seq-session" }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
warnings = "deny"
