name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per backend. `cargo test --workspace` alone is NOT enough coverage:
  # it builds every crate with its own default features, so seq-decode is only
  # ever compiled against seq-structs-live. A struct-mirror or shared-FFI change
  # can therefore pass --workspace and still break the test or eql link that the
  # daemon actually builds (-DSEQ_TARGET picks exactly one backend-* feature).
  backend:
    name: ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # live is the default-feature build, so --workspace here also runs
          # every crate's own unit tests (seq-backend-eql's included).
          - backend: live
            test: cargo test --workspace
            clippy: cargo clippy --workspace --all-targets
          # seq-decode's parsers against the test struct mirror — the pairing
          # --workspace never compiles.
          - backend: test
            test: >-
              cargo test -p seq-decode --no-default-features --features backend-test &&
              cargo test -p seq-session --no-default-features --features backend-test &&
              cargo test -p seq-trace --no-default-features --features backend-test &&
              cargo test -p seq-bridge --no-default-features --features backend-test
            clippy: >-
              cargo clippy -p seq-decode -p seq-session -p seq-trace -p seq-bridge
              --no-default-features --features backend-test --all-targets
          - backend: eql
            test: >-
              cargo test -p seq-backend-eql &&
              cargo test -p seq-session --no-default-features --features backend-eql &&
              cargo test -p seq-trace --no-default-features --features backend-eql &&
              cargo test -p seq-bridge --no-default-features --features backend-eql
            clippy: >-
              cargo clippy -p seq-backend-eql -p seq-session -p seq-trace -p seq-bridge
              --no-default-features --features backend-eql --all-targets
    steps:
      - uses: actions/checkout@v5

      - name: toolchain
        run: rustc -V && cargo -V

      - name: test
        run: ${{ matrix.test }}

      # The workspace sets `[workspace.lints.rust] warnings = "deny"`, which
      # covers clippy lints too — so an unclean tree breaks `cargo clippy` for
      # everyone, not just CI. Run it per backend: the feature-gated FFI arms in
      # seq-bridge are only linted under the feature that enables them.
      - name: clippy
        run: ${{ matrix.clippy }}

      # Release, because that is the profile the daemon links through Corrosion
      # (thin LTO + codegen-units=1 — a debug build passing doesn't prove it).
      - name: build the staticlib the daemon links
        run: >-
          cargo build -p seq-bridge --release
          --no-default-features --features backend-${{ matrix.backend }}

  # Backend-independent, so it runs once rather than in the matrix. Note the
  # generated seq-structs-{live,test}/src/bindings.rs are pulled in with
  # `include!()`, which rustfmt does not follow — regenerating them can never
  # break this check.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  event-contract:
    name: event and legacy-source coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check generated manifest, bridge mapping, and source inventory
        run: |
          python3 tools/event_coverage.py check
          python3 -B -m unittest discover -s tools -p 'test_event_coverage.py'

  eql-isolation:
    name: eql links no Live decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The 2026-07-09 clean break: seq-backend-eql vendors its own copy of every
      # parser so a Live wire patch cannot reach eql. Nothing in the type system
      # enforces that — one `seq-decode` dependency re-couples them silently, and
      # the symptom would be an eql mis-decode months later. Guard the edge.
      - name: seq-decode must not appear in an EQL consumer dep tree
        run: |
          for package in seq-bridge seq-trace seq-session; do
            tree=$(cargo tree -p "$package" --no-default-features --features backend-eql)
            if grep -q 'seq-decode' <<<"$tree"; then
              echo "::error::$package backend-eql pulled in seq-decode — the eql/Live clean break is broken"
              grep -n 'seq-decode' <<<"$tree"
              exit 1
            fi
          done
          echo "ok: backend-eql has no seq-decode edge"
