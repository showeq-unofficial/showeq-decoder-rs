[package]
name = "seq-bridge"
description = "C++ FFI bridge (cxx) for the Scry Rust decoder."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

# Backend selection. live/test link the shared seq-decode stack (its bindings
# crate cfg-selected). eql links ONLY seq-backend-eql — a self-contained stack
# with no seq-decode edge, so a Live wire change can't reach eql. The decode_*
# FFI surface is identical for every backend; the `backend` alias in lib.rs
# points at whichever crate the active feature linked.
[features]
default = ["backend-live"]
backend-live = ["dep:seq-decode", "seq-decode/backend-live", "seq-session/backend-live"]
backend-test = ["dep:seq-decode", "seq-decode/backend-test", "seq-session/backend-test"]
backend-eql  = ["dep:seq-backend-eql", "seq-session/backend-eql"]

[dependencies]
cxx.workspace = true
seq-decode = { workspace = true, default-features = false, optional = true }
seq-backend-eql = { workspace = true, optional = true }
seq-events.workspace = true
seq-protocol-data.workspace = true
seq-session = { workspace = true, default-features = false }

[build-dependencies]
cxx-build.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
